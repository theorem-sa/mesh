name: Theorem Mesh release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'theorem-sa/mesh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build and publish binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.3.2"
          args: release --config .goreleaser.theorem.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
