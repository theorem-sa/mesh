<!DOCTYPE html>
<html lang="en">
<head>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f2ed;
            font-family: sans-serif, Arial, Tahoma;
        }

        .container {
            width: 100%;
            background: #f3f2ed;
            border: 1px solid #c8cac4;
            text-align: center;
            padding: 20px;
            padding-bottom: 50px;
            max-width: 550px;
            margin: 0 10px;
        }

        .logo {
            height: 80px;
            border-bottom: 1px solid #e8e9ea;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo svg {
            width: 54px;
            color: #111411;
        }

        .content {
            font-size: 13px;
            color: #5c615d;
            line-height: 18px;
            padding: 10px 0;
        }

        .content div {
            font-size: 18px;
            line-height: normal;
            margin-bottom: 5px;
            color: #111411;
        }
    </style>
    <title>Theorem Mesh sign-in</title>
</head>
<body>
<div class="container">
    <div class="logo">
        <svg aria-label="Theorem" role="img" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M551 461Q562 447 562 423.5Q562 400 548 383H389Q439 369 473.5 328Q508 287 508 238Q508 139 443 65Q378-9 276-9Q174-9 107 53Q42 115 42 226.5Q42 338 125 399.5Q208 461 326 461ZM416 261Q416 300 400 336Q381 388 349 388Q124 388 124 193Q124 132 155 78.5Q186 25 244 25Q321 25 372 107Q416 178 416 261Z" transform="translate(10.17 48.34) scale(0.0723 -0.0723)"/>
        </svg>
    </div>
    <br>
    {{ if .Error }}
    <svg height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" fill="none" r="45" stroke="red" stroke-width="3"/>
        <path d="M30 30 L70 70 M30 70 L70 30" fill="none" stroke="red" stroke-width="3"/>
    </svg>
    <div class="content">
        <div>
            Sign-in failed
        </div>
        {{ .Error }}.
    </div>
    {{ else }}
    <svg height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" fill="none" r="45" stroke="#5cb85c" stroke-width="3"/>
        <path d="M30 50 L45 65 L70 35" fill="none" stroke="#5cb85c" stroke-width="5"/>
    </svg>
    <div class="content">
        <div>
            Sign-in successful
        </div>
        Your device is now connected to Theorem Mesh.
        <br>
        You can now close this window.
    </div>
    {{ end }}
</div>
</body>
</html>
